{% extends "products/base.html" %}
{% load static %}

{% block title %}Contraseña Cambiada{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-screen-minus-header">
    <div class="w-full max-w-md p-8 md:p-10 bg-slate-800/80 backdrop-blur-sm rounded-xl shadow-2xl border border-violet-700/50">
        <div class="text-center">
            <i class="fas fa-lock-open text-6xl text-green-400 mb-6"></i>
            <h1 class="text-3xl font-bold text-white mb-4">¡Contraseña Restablecida!</h1>
            <p class="text-gray-300 mb-6">
                Tu contraseña ha sido establecida con éxito. Ahora puedes iniciar sesión con tu nueva contraseña.
            </p>
            <div class="mt-8">
                <a href="{% url 'login' %}" 
                   class="inline-flex items-center justify-center w-full px-4 py-3 border border-transparent text-base font-medium rounded-lg text-white bg-violet-600 hover:bg-violet-700 shadow-lg transition duration-150 ease-in-out">
                    <i class="fas fa-sign-in-alt mr-2"></i> Iniciar Sesión Ahora
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
