<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Producto</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <main class="max-w-lg mx-auto px-6 py-20">
        <div class="bg-white rounded-2xl shadow-lg p-8 text-center">
            <h1 class="text-2xl font-bold text-red-600 mb-4">⚠ Eliminar Producto</h1>
            <p class="text-gray-600 mb-6">¿Estás seguro que deseas eliminar 
                <span class="font-semibold text-gray-800">"{{ product.title }}"</span>?
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="flex gap-4 justify-center">
                    <button type="submit" 
                            class="px-6 py-3 bg-gradient-to-r from-red-500 to-red-600 text-white rounded-xl shadow-md hover:scale-105 transition">
                        🗑 Sí, eliminar
                    </button>
                    <a href="{% url 'product_list' %}" 
                       class="px-6 py-3 bg-gradient-to-r from-gray-400 to-gray-500 text-white rounded-xl shadow-md hover:scale-105 transition">
                        ❌ Cancelar
                    </a>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
