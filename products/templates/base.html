<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Productos{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-black text-white min-h-screen flex flex-col">

    <!-- 🔹 Navbar -->
    <header class="bg-gradient-to-r from-gray-950 via-purple-950 to-gray-950 shadow-lg sticky top-0 z-50 border-b border-purple-500/20">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            
            <!-- Logo -->
            <a href="{% url 'product_list' %}" class="flex items-center gap-2 text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-500 hover:from-purple-300 hover:to-indigo-500 transition-all">
                🛍 <span class="hidden sm:inline">Mi Tienda</span>
            </a>
            
            <!-- Menú -->
            <nav class="flex gap-6">
                <a href="{% url 'product_list' %}" 
                   class="relative hover:text-indigo-400 transition group">
                    Productos
                    <span class="absolute left-0 -bottom-1 w-0 h-0.5 bg-indigo-400 transition-all group-hover:w-full"></span>
                </a>
                <a href="{% url 'create_product' %}" 
                   class="relative hover:text-indigo-400 transition group">
                    Crear
                    <span class="absolute left-0 -bottom-1 w-0 h-0.5 bg-indigo-400 transition-all group-hover:w-full"></span>
                </a>
            </nav>
        </div>
    </header>

    <!-- 🔹 Contenido -->
    <main class="max-w-7xl mx-auto flex-grow py-10 px-6">
        {% block content %}{% endblock %}
    </main>

    <!-- 🔹 Footer -->
    <footer class="bg-gradient-to-r from-gray-950 via-purple-950 to-gray-950 py-6 text-center text-gray-400 mt-12 border-t border-purple-500/20">
        <p class="text-sm">
            © 2025 - <span class="text-indigo-400">Mi Tienda</span> | Desarrollado con 
            <span class="text-purple-400">Django</span> + <span class="text-indigo-400">TailwindCSS</span>
        </p>
    </footer>
</body>
</html>
