<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Productos{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 text-white min-h-screen">
    <!-- Navbar -->
    <header class="bg-gray-950 shadow-md">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-indigo-400">🛍 Mi Tienda</h1>
        <nav class="flex gap-6">
            <a href="{% url 'product_list' %}" class="hover:text-indigo-400 transition">Productos</a>
            <a href="{% url 'create_product' %}" class="hover:text-indigo-400 transition">Crear</a>
        </nav>
    </div>
</header>

<!-- Contenido -->
<main class="max-w-7xl mx-auto py-10 px-6">
    {% block content %}{% endblock %}
</main>

<!-- Footer -->
<footer class="bg-gray-950 py-6 text-center text-gray-400 mt-12 border-t border-gray-800">
    © 2025 - Mi Tienda | Desarrollado con Django + Tailwind
</footer>
</body>
</html>
