<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Producto</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">➕ Nuevo Producto</h1>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <!-- Título -->
            <div>
                <label class="block text-gray-700 font-medium">Título</label>
                <input type="text" name="title" required
                    class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>

            <!-- Precio -->
            <div>
                <label class="block text-gray-700 font-medium">Precio</label>
                <input type="number" name="price" step="0.01" required
                    class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>

            <!-- Descripción -->
            <div>
                <label class="block text-gray-700 font-medium">Descripción</label>
                <textarea name="description" rows="3" required
                        class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>
            </div>

            <!-- Categoría -->
            <div>
                <label class="block text-gray-700 font-medium">Categoría</label>
                <select name="categoryId" required
                        class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                    <option value="">-- Selecciona una categoría --</option>
                    {% for category in categories %}
                        <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Imagen -->
            <div>
                <label class="block text-gray-700 font-medium">URL Imagen</label>
                <input type="url" name="image" placeholder="https://..." required
                    class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>

            <!-- Botón Guardar -->
            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition">
                Guardar Producto
            </button>
        </form>

        <!-- Botón volver -->
        <div class="mt-4 text-center">
            <a href="{% url 'product_list' %}" class="text-indigo-600 hover:underline text-sm">
                ⬅ Volver a la lista de productos
            </a>
        </div>
    </div>
</body>
</html>
