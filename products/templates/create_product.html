{% extends "base.html" %}

{% block title %}Crear Producto{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-900 via-purple-900 to-black py-12 px-4">
    <div class="max-w-3xl mx-auto bg-gray-800/80 backdrop-blur-md rounded-2xl shadow-2xl p-10 border border-gray-700">
        
        <!-- Encabezado -->
        <h1 class="text-3xl font-bold text-purple-400 mb-8 text-center flex items-center justify-center gap-2">
            ✨ Crear Nuevo Producto
        </h1>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            <!-- Título -->
            <div>
                <label class="block text-gray-300 font-semibold mb-2">Título</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">📦</span>
                    <input type="text" name="title" required
                           class="w-full pl-10 pr-4 py-3 bg-gray-900 text-white border border-gray-700 rounded-lg shadow focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
                </div>
            </div>

            <!-- Precio -->
            <div>
                <label class="block text-gray-300 font-semibold mb-2">Precio</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">$</span>
                    <input type="number" name="price" required min="1"
                           class="w-full pl-8 pr-4 py-3 bg-gray-900 text-white border border-gray-700 rounded-lg shadow focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
                </div>
            </div>

            <!-- Descripción -->
            <div>
                <label class="block text-gray-300 font-semibold mb-2">Descripción</label>
                <textarea name="description" rows="4" required
                          class="w-full px-4 py-3 bg-gray-900 text-white border border-gray-700 rounded-lg shadow focus:ring-2 focus:ring-purple-500 focus:border-purple-500"></textarea>
            </div>

            <!-- Categoría -->
            <div>
                <label class="block text-gray-300 font-semibold mb-2">Categoría</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">📂</span>
                    <select name="categoryId" required
                            class="w-full pl-10 pr-4 py-3 bg-gray-900 text-white border border-gray-700 rounded-lg shadow focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
                        <option value="">-- Selecciona una categoría --</option>
                        {% for category in categories %}
                        <option value="{{ category.id }}">{{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Imagen -->
            <div>
                <label class="block text-gray-300 font-semibold mb-2">URL de la Imagen</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">🖼</span>
                    <input type="url" name="image" required
                           class="w-full pl-10 pr-4 py-3 bg-gray-900 text-white border border-gray-700 rounded-lg shadow focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
                </div>
            </div>

            <!-- Botones -->
            <div class="flex justify-between items-center mt-8">
                <a href="{% url 'product_list' %}"
                   class="px-6 py-3 bg-gradient-to-r from-gray-700 to-gray-800 text-white font-semibold rounded-xl shadow-md hover:scale-105 transition">
                    ⬅ Volver
                </a>
                <button type="submit"
                        class="px-6 py-3 bg-gradient-to-r from-purple-500 to-indigo-600 text-white font-semibold rounded-xl shadow-md hover:scale-105 transition">
                    ✅ Crear Producto
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
