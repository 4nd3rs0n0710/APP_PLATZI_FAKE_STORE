<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar {{ product.title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-2xl mx-auto py-10 px-4">
        <div class="bg-white shadow-lg rounded-xl p-6">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">✏️ Editar Producto</h1>

            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-gray-700">Título:</label>
                    <input type="text" name="title" value="{{ product.title }}"
                           class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-400 outline-none">
                </div>

                <div>
                    <label class="block text-gray-700">Precio:</label>
                    <input type="number" name="price" value="{{ product.price }}"
                           class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-400 outline-none">
                </div>

                <div>
                    <label class="block text-gray-700">Descripción:</label>
                    <textarea name="description"
                              class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-400 outline-none">{{ product.description }}</textarea>
                </div>

                <div>
                    <label class="block text-gray-700">Categoría:</label>
                    <select name="categoryId" class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-400 outline-none">
                        {% for category in categories %}
                            <option value="{{ category.id }}" {% if product.category.id == category.id %}selected{% endif %}>
                                {{ category.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-gray-700">URL Imagen:</label>
                    <input type="text" name="image" value="{{ product.images.0 }}"
                           class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-400 outline-none">
                </div>

                <button type="submit" 
                        class="w-full bg-yellow-500 hover:bg-yellow-600 text-white py-2 rounded-lg font-semibold">
                    💾 Guardar Cambios
                </button>
            </form>
        </div>
    </div>
</body>
</html>
