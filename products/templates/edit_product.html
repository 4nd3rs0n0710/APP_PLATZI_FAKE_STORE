{% extends "base.html" %}
{% block title %}Editar Producto{% endblock %}

{% block content %}
<div class="bg-gray-800 p-8 rounded-2xl shadow-lg max-w-3xl mx-auto">
  <h1 class="text-2xl font-bold text-white mb-6">✏ Editar Producto</h1>

  <form method="post" class="space-y-5">
    {% csrf_token %}

    <!-- Nombre -->
    <div>
      <label class="block text-gray-300 mb-1">Nombre</label>
      <input type="text" name="title" value="{{ product.title }}"
             class="w-full px-4 py-2 rounded-lg bg-gray-900 text-white border border-gray-700 focus:ring-2 focus:ring-indigo-400 outline-none">
    </div>

    <!-- Precio -->
    <div>
      <label class="block text-gray-300 mb-1">Precio</label>
      <input type="number" name="price" value="{{ product.price }}"
             class="w-full px-4 py-2 rounded-lg bg-gray-900 text-white border border-gray-700 focus:ring-2 focus:ring-indigo-400 outline-none">
    </div>

    <!-- Descripción -->
    <div>
      <label class="block text-gray-300 mb-1">Descripción</label>
      <textarea name="description" rows="4"
                class="w-full px-4 py-2 rounded-lg bg-gray-900 text-white border border-gray-700 focus:ring-2 focus:ring-indigo-400 outline-none">{{ product.description }}</textarea>
    </div>

    <!-- Categoría -->
    <div>
      <label class="block text-gray-300 mb-1">Categoría</label>
      <select name="categoryId"
              class="w-full px-4 py-2 rounded-lg bg-gray-900 text-white border border-gray-700 focus:ring-2 focus:ring-indigo-400 outline-none">
        {% for category in categories %}
          <option value="{{ category.id }}"
            {% if product.category.id == category.id %}selected{% endif %}>
            {{ category.name }}
          </option>
        {% endfor %}
      </select>
    </div>

    <!-- Imagen -->
    <div>
      <label class="block text-gray-300 mb-1">Imagen (URL)</label>
      <input type="text" name="image" value="{{ product.images.0 }}"
             class="w-full px-4 py-2 rounded-lg bg-gray-900 text-white border border-gray-700 focus:ring-2 focus:ring-indigo-400 outline-none">
    </div>

    <!-- Botones -->
    <div class="flex gap-4 justify-end">
      <a href="{% url 'product_detail' product.id %}"
         class="px-5 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded-xl shadow transition">
        ⬅ Cancelar
      </a>
      <button type="submit"
              class="px-5 py-2 bg-gradient-to-r from-yellow-500 to-orange-500 hover:scale-105 transition text-white font-semibold rounded-xl shadow-md">
        💾 Guardar Cambios
      </button>
    </div>
  </form>
</div>
{% endblock %}
