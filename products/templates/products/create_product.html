{% extends "base.html" %}

{% block title %}Crear Producto{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 py-12 px-4">
    <div class="max-w-3xl mx-auto bg-gray-800 rounded-2xl shadow-2xl p-10 border border-gray-700">
        <h1 class="text-3xl font-bold text-white mb-6 text-center">
            ✨ Crear Nuevo Producto
        </h1>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            <!-- Título -->
            <div>
                <label class="block text-gray-300 font-semibold mb-2">Título</label>
                <input type="text" name="title" required
                    class="w-full px-4 py-3 bg-gray-900 text-white border border-gray-600 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-400 focus:outline-none">
            </div>

            <!-- Precio -->
            <div>
                <label class="block text-gray-300 font-semibold mb-2">Precio</label>
                <input type="number" name="price" required min="1"
                    class="w-full px-4 py-3 bg-gray-900 text-white border border-gray-600 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-400 focus:outline-none">
            </div>

            <!-- Descripción -->
            <div>
                <label class="block text-gray-300 font-semibold mb-2">Descripción</label>
                <textarea name="description" rows="4" required
                        class="w-full px-4 py-3 bg-gray-900 text-white border border-gray-600 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-400 focus:outline-none"></textarea>
            </div>

            <!-- Categoría -->
            <div>
                <label class="block text-gray-300 font-semibold mb-2">Categoría</label>
                <select name="categoryId" required
                        class="w-full px-4 py-3 bg-gray-900 text-white border border-gray-600 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-400 focus:outline-none">
                    <option value="">-- Selecciona una categoría --</option>
                    {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Imagen -->
            <div>
                <label class="block text-gray-300 font-semibold mb-2">URL de la Imagen</label>
                <input type="url" name="image" required
                    class="w-full px-4 py-3 bg-gray-900 text-white border border-gray-600 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-400 focus:outline-none">
            </div>

            <!-- Botones -->
            <div class="flex justify-between items-center mt-6">
                <a href="{% url 'product_list' %}"
                class="px-6 py-3 bg-gradient-to-r from-gray-600 to-gray-700 text-white font-semibold rounded-xl shadow-md hover:scale-105 transition">
                    ⬅ Volver
                </a>
                <button type="submit"
                        class="px-6 py-3 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-semibold rounded-xl shadow-md hover:scale-105 transition">
                    ✅ Crear Producto
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
