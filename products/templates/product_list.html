<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
    <!-- Navbar -->
    <nav class="bg-white shadow p-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-indigo-600">🛍️ Platzi Store</h1>
        <a href="{% url 'create_product' %}" 
            class="px-4 py-2 bg-indigo-600 text-white rounded-lg shadow hover:bg-indigo-700 transition">
        ➕ Crear Producto
        </a>
    </nav>

    <!-- Contenedor principal -->
    <div class="max-w-6xl mx-auto py-8 px-4">
        <h2 class="text-xl font-semibold mb-6">Lista de Productos</h2>

        <!-- Grid de productos -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            {% for product in products %}
            <div class="bg-white rounded-2xl shadow hover:shadow-lg transition overflow-hidden">
                <img src="{{ product.images.0 }}" alt="{{ product.title }}" 
                    class="w-full h-48 object-cover">
                <div class="p-4">
                    <h3 class="text-lg font-bold text-gray-800">{{ product.title }}</h3>
                    <p class="text-sm text-gray-500 h-12 overflow-hidden">{{ product.description }}</p>
                    <div class="mt-3 flex justify-between items-center">
                        <span class="text-indigo-600 font-bold">${{ product.price }}</span>
                        <button class="px-3 py-1 text-sm bg-indigo-100 text-indigo-700 rounded hover:bg-indigo-200">
                            Comprar
                        </button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
