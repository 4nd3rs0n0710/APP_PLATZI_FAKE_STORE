<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-7xl mx-auto py-10 px-4">
        <!-- Encabezado -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <h1 class="text-3xl font-bold text-gray-800">🛒 Lista de Productos</h1>
            <a href="{% url 'create_product' %}" 
               class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg shadow-md transition">
                ➕ Crear Producto
            </a>
        </div>

        <!-- Filtros -->
        <div class="bg-white p-4 rounded-xl shadow-md mb-8 flex flex-col md:flex-row gap-4 md:items-center">
            <!-- Buscador -->
            <input id="searchInput" type="text" 
                   placeholder="🔍 Buscar producto..." 
                   class="w-full md:w-1/2 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none">

            <!-- Filtro categorías -->
            <select id="categoryFilter" 
                    class="w-full md:w-1/3 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none">
                <option value="all">Todas las categorías</option>
                {% for product in products %}
                    <option value="{{ product.category.name }}">{{ product.category.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Grid de productos -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for product in products %}
            <div class="product-card bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition"
                 data-title="{{ product.title|lower }}" 
                 data-category="{{ product.category.name }}">
                <!-- Imagen -->
                <img src="{{ product.images.0 }}" alt="{{ product.title }}" 
                     class="w-full h-48 object-cover">

                <!-- Contenido -->
                <div class="p-4">
                    <h2 class="text-lg font-semibold text-gray-800 mb-1">
                        {{ product.title }}
                    </h2>
                    <p class="text-sm text-gray-500 mb-2">
                        Categoría: <span class="font-medium">{{ product.category.name }}</span>
                    </p>
                    <p class="text-gray-700 text-sm mb-3 line-clamp-2">
                        {{ product.description }}
                    </p>
                    <p class="text-indigo-600 font-bold text-lg">
                        ${{ product.price }}
                    </p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Script para filtros -->
    <script>
        const searchInput = document.getElementById("searchInput");
        const categoryFilter = document.getElementById("categoryFilter");
        const productCards = document.querySelectorAll(".product-card");

        function filterProducts() {
            const searchText = searchInput.value.toLowerCase();
            const selectedCategory = categoryFilter.value;

            productCards.forEach(card => {
                const title = card.getAttribute("data-title");
                const category = card.getAttribute("data-category");

                const matchesSearch = title.includes(searchText);
                const matchesCategory = selectedCategory === "all" || category === selectedCategory;

                if (matchesSearch && matchesCategory) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        }

        searchInput.addEventListener("input", filterProducts);
        categoryFilter.addEventListener("change", filterProducts);
    </script>
</body>
</html>
