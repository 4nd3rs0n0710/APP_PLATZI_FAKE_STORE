{% extends "base.html" %}

{% block title %}Detalle de {{ product.title }}{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl shadow-lg p-8 max-w-4xl mx-auto">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Imagen del producto -->
        <div>
            <img src="{{ product.images.0 }}" alt="{{ product.title }}"
                 class="w-full h-72 object-cover rounded-xl shadow-md">
        </div>

        <!-- Información del producto -->
        <div>
            <h1 class="text-3xl font-bold text-gray-800 mb-3">{{ product.title }}</h1>
            <p class="text-gray-600 mb-2">
                <span class="font-semibold">Categoría:</span> {{ product.category.name }}
            </p>
            <p class="text-gray-700 mb-4 leading-relaxed">
                {{ product.description }}
            </p>
            <p class="text-indigo-600 font-extrabold text-2xl mb-6">
                ${{ product.price }}
            </p>

            <!-- Botones de acción -->
            <div class="flex gap-4">
                <a href="{% url 'edit_product' product.id %}" 
                   class="px-5 py-3 bg-gradient-to-r from-yellow-500 to-yellow-600 text-white rounded-xl shadow-md hover:scale-105 transition">
                    ✏ Editar
                </a>
                <form action="{% url 'delete_product' product.id %}" method="post"
                      onsubmit="return confirm('¿Seguro que deseas eliminar este producto?');">
                    {% csrf_token %}
                    <button type="submit" 
                            class="px-5 py-3 bg-gradient-to-r from-red-500 to-red-600 text-white rounded-xl shadow-md hover:scale-105 transition">
                        🗑 Eliminar
                    </button>
                </form>
                <a href="{% url 'product_list' %}" 
                   class="px-5 py-3 bg-gradient-to-r from-gray-400 to-gray-500 text-white rounded-xl shadow-md hover:scale-105 transition">
                    🔙 Volver
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
