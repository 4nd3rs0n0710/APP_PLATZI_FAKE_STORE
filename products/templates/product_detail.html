<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ product.title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-3xl mx-auto py-10 px-4">
        <div class="bg-white rounded-xl shadow-md p-6">
            <img src="{{ product.images.0 }}" alt="{{ product.title }}" class="w-full h-64 object-cover rounded-lg mb-4">

            <h1 class="text-2xl font-bold text-gray-800">{{ product.title }}</h1>
            <p class="text-gray-600 mb-2">Categoría: <span class="font-medium">{{ product.category.name }}</span></p>
            <p class="text-gray-700 mb-4">{{ product.description }}</p>
            <p class="text-indigo-600 font-bold text-xl mb-4">${{ product.price }}</p>

            <div class="flex gap-4">
                <a href="{% url 'edit_product' product.id %}" 
                    class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg">
                    ✏️ Editar
                </a>
                <a href="{% url 'product_list' %}" 
                    class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg">
                    🔙 Volver
                </a>
            </div>
        </div>
    </div>
</body>
</html>
